version: '3.8'

services:
  signaling:
    build: .
    container_name: kinassist-signaling
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production

  coturn:
    image: coturn/coturn:latest
    container_name: kinassist-coturn
    restart: unless-stopped
    network_mode: "host"
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49152
      - --max-port=49200
      - --realm=kinassist.app
      - --lt-cred-mech
      - --user=kinuser:kinassist_secret_pass
      - --fingerprint
      - --no-tls
